<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaplan Kümesi - Pigeon Paradise</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#17242e;
 color:white;
 overflow-x:hidden;
}
header{
 background:#101820;
 padding:15px;
 text-align:center;
 border-bottom:2px solid #e2af3c;
}
h1{margin:0;color:#e2af3c;font-size:28px}
.sub{color:#aaa;margin-top:5px}

.stats{
 display:flex;
 gap:10px;
 padding:10px;
 overflow:auto;
 background:#1d2d38;
}
.stat{
 background:#263946;
 border:1px solid #49616d;
 border-radius:10px;
 padding:10px 15px;
 min-width:110px;
 text-align:center;
}

.game{
 max-width:1000px;
 margin:auto;
 padding:15px;
}

.roof{
 position:relative;
 min-height:330px;
 background:linear-gradient(#4d7ca5 0%,#7da4c4 55%,#5c5c5c 56%,#424242 100%);
 border-radius:18px;
 overflow:hidden;
 border:3px solid #263946;
}

.sun{
 position:absolute;
 width:55px;height:55px;
 border-radius:50%;
 background:#ffd75e;
 right:30px;top:25px;
 box-shadow:0 0 35px #ffd75e;
}

.owner{
 position:absolute;
 left:25px;
 bottom:35px;
 text-align:center;
 font-size:52px;
 filter:drop-shadow(2px 4px 3px #000);
}

.ownerName{
 font-size:14px;
 background:#111;
 padding:5px 8px;
 border-radius:8px;
 color:#e2af3c;
}

.coop{
 position:absolute;
 right:35px;
 bottom:25px;
 width:70%;
 max-width:650px;
 background:#9b613b;
 border:7px solid #60371f;
 border-radius:12px 12px 4px 4px;
 padding:15px;
}

.coopTitle{
 text-align:center;
 color:#fff4d4;
 font-weight:bold;
 margin-bottom:10px;
 font-size:18px;
}

.nests{
 display:grid;
 grid-template-columns:repeat(6,1fr);
 gap:7px;
}

.nest{
 background:#4e301e;
 border:2px solid #c58a4c;
 border-radius:8px;
 min-height:55px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 font-size:20px;
 transition:.2s;
}

.nest:hover{
 transform:scale(1.05);
 border-color:#ffd75e;
}

.nest small{
 font-size:9px;
 color:#ddd;
}

.panel{
 margin-top:15px;
 background:#1e2d38;
 border:1px solid #415967;
 border-radius:15px;
 padding:15px;
}

.panel h2{
 margin-top:0;
 color:#e2af3c;
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
}

button{
 border:0;
 padding:12px 16px;
 border-radius:10px;
 background:#e2af3c;
 color:#1b1b1b;
 font-weight:bold;
 cursor:pointer;
 font-size:15px;
}

button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5}

.birds{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
 gap:10px;
 margin-top:15px;
}

.bird{
 background:#283b48;
 border:1px solid #49616d;
 border-radius:12px;
 padding:12px;
 text-align:center;
}

.birdIcon{font-size:42px}
.male{border-bottom:4px solid #55aaff}
.female{border-bottom:4px solid #ff75b5}
.baby{border-bottom:4px solid #7ee36e}

.log{
 max-height:180px;
 overflow:auto;
 background:#111b22;
 border-radius:10px;
 padding:10px;
 color:#ddd;
 margin-top:15px;
}

.log div{
 padding:5px;
 border-bottom:1px solid #263946;
}

#message{
 margin-top:10px;
 padding:10px;
 border-radius:8px;
 background:#243541;
 color:#ffd75e;
 display:none;
}

@media(max-width:650px){
 .coop{
  position:relative;
  right:auto;
  bottom:auto;
  width:100%;
  max-width:none;
  margin-top:140px;
 }
 .roof{padding:10px}
 .nests{grid-template-columns:repeat(5,1fr)}
 .owner{bottom:260px}
}
</style>
</head>

<body>

<header>
 <h1>🕊️ KAPLAN KÜMESİ</h1>
 <div class="sub">Pigeon Paradise • Güvercin Yetiştirme Oyunu</div>
</header>

<div class="stats">
 <div class="stat">💰 Para<br><b id="money">1000</b> ₺</div>
 <div class="stat">🌾 Yem<br><b id="food">100</b></div>
 <div class="stat">🕊️ Güvercin<br><b id="birdCount">0</b></div>
 <div class="stat">🥚 Yumurta<br><b id="eggCount">0</b></div>
 <div class="stat">🐣 Yavru<br><b id="babyCount">0</b></div>
</div>

<div class="game">

<div class="roof">
 <div class="sun"></div>

 <div class="owner">
  👨🏻
  <div class="ownerName">KAPLAN<br>Güvercin Sahibi</div>
 </div>

 <div class="coop">
  <div class="coopTitle">🏠 KAPLAN KÜMESİ — 30 YUVA</div>
  <div class="nests" id="nests"></div>
 </div>
</div>

<div class="panel">
 <h2>🎮 Kümes Yönetimi</h2>

 <div class="buttons">
  <button onclick="buyMale()">🕊️ Erkek Güvercin Al — 150₺</button>
  <button onclick="buyFemale()">🕊️ Dişi Güvercin Al — 150₺</button>
  <button onclick="buyFood()">🌾 50 Yem Al — 50₺</button>
  <button onclick="feedBirds()">🌾 Güvercinleri Yemle</button>
  <button onclick="breed()">❤️ Güvercinleri Çiftleştir</button>
 </div>

 <div id="message"></div>
</div>

<div class="panel">
 <h2>🕊️ Güvercinlerim</h2>
 <div class="birds" id="birds"></div>
</div>

<div class="panel">
 <h2>📜 Kümes Olayları</h2>
 <div class="log" id="log"></div>
</div>

</div>

<script>

let money=1000;
let food=100;
let birds=[];
let eggs=[];
let babies=[];
let nextId=1;

function log(text){
 const box=document.getElementById("log");
 box.innerHTML="<div>🕒 "+text+"</div>"+box.innerHTML;
}

function message(text){
 const m=document.getElementById("message");
 m.style.display="block";
 m.innerText=text;
 setTimeout(()=>m.style.display="none",3000);
}

function update(){
 document.getElementById("money").innerText=money;
 document.getElementById("food").innerText=food;
 document.getElementById("birdCount").innerText=birds.length;
 document.getElementById("eggCount").innerText=eggs.length;
 document.getElementById("babyCount").innerText=babies.length;

 renderNests();
 renderBirds();
 saveGame();
}

function renderNests(){
 const nests=document.getElementById("nests");
 nests.innerHTML="";

 for(let i=1;i<=30;i++){

  let bird=birds[i-1];
  let egg=eggs.find(e=>e.nest===i);
  let baby=babies.find(b=>b.nest===i);

  let content="🪹";
  let name="Boş";

  if(bird){
   content=bird.gender==="male"?"🕊️":"🕊️";
   name=bird.name;
  }

  if(egg){
   content="🥚";
   name="Yumurta • "+egg.days+" gün";
  }

  if(baby){
   content=baby.stage==="yavru"?"🐣":"🕊️";
   name=baby.stage+" • "+baby.days+" gün";
  }

  nests.innerHTML+=`
  <div class="nest" onclick="nestInfo(${i})">
   <div>${content}</div>
   <small>${i}. Yuva<br>${name}</small>
  </div>`;
 }
}

function nestInfo(i){
 let bird=birds[i-1];
 let egg=eggs.find(e=>e.nest===i);
 let baby=babies.find(b=>b.nest===i);

 if(bird) message(i+". yuvada "+bird.name+" bulunuyor.");
 else if(egg) message(i+". yuvada yumurta var. "+egg.days+" gün kaldı.");
 else if(baby) message(i+". yuvada büyüyen yavru var.");
 else message(i+". yuva şu anda boş.");
}

function renderBirds(){
 const box=document.getElementById("birds");

 if(birds.length===0){
  box.innerHTML="<p>Henüz güvercinin yok. İlk güvercinlerini satın al.</p>";
  return;
 }

 box.innerHTML="";

 birds.forEach((bird,index)=>{
  box.innerHTML+=`
  <div class="bird ${bird.gender}">
   <div class="birdIcon">🕊️</div>
   <b>${bird.name}</b><br>
   ${bird.gender==="male"?"♂️ Erkek":"♀️ Dişi"}<br>
   <small>Yaş: ${bird.age} gün</small><br>
   <small>Sağlık: ❤️ ${bird.health}</small>
  </div>`;
 });
}

function buyMale(){
 if(money<150){
  message("❌ Yeterli paran yok!");
  return;
 }

 if(birds.length>=30){
  message("❌ 30 yuvanın tamamı dolu!");
  return;
 }

 money-=150;

 birds.push({
  id:nextId++,
  name:"Erkek #"+nextId,
  gender:"male",
  age:30,
  health:100
 });

 log("Yeni erkek güvercin satın alındı.");
 update();
}

function buyFemale(){
 if(money<150){
  message("❌ Yeterli paran yok!");
  return;
 }

 if(birds.length>=30){
  message("❌ 30 yuvanın tamamı dolu!");
  return;
 }

 money-=150;

 birds.push({
  id:nextId++,
  name:"Dişi #"+nextId,
  gender:"female",
  age:30,
  health:100
 });

 log("Yeni dişi güvercin satın alındı.");
 update();
}

function buyFood(){
 if(money<50){
  message("❌ Yeterli paran yok!");
  return;
 }

 money-=50;
 food+=50;

 log("50 yem satın alındı.");
 update();
}

function feedBirds(){
 let needed=birds.length*2;

 if(birds.length===0){
  message("Önce güvercin almalısın!");
  return;
 }

 if(food<needed){
  message("❌ Yeterli yem yok!");
  return;
 }

 food-=needed;

 birds.forEach(b=>{
  b.health=Math.min(100,b.health+10);
 });

 log("Güvercinler yemlendi. 🌾");
 message("🕊️ Güvercinler mutlu ve tok!");
 update();
}

function breed(){

 let males=birds.filter(b=>b.gender==="male");
 let females=birds.filter(b=>b.gender==="female");

 if(males.length===0 || females.length===0){
  message("❌ Çiftleşmek için en az 1 erkek ve 1 dişi gerekli!");
  return;
 }

 if(food<10){
  message("❌ Çiftleşme için kümesinde yeterli yem olmalı!");
  return;
 }

 food-=10;

 let emptyNest=null;

 for(let i=1;i<=30;i++){
  if(!eggs.some(e=>e.nest===i) && !babies.some(b=>b.nest===i)){
   emptyNest=i;
   break;
  }
 }

 if(emptyNest===null){
  message("❌ Yumurta için boş yuva yok!");
  return;
 }

 if(Math.random()<0.75){

  eggs.push({
   nest:emptyNest,
   days:3
  });

  log("❤️ Bir çift güvercin çiftleşti!");
  log("🥚 "+emptyNest+". yuvaya yumurta bırakıldı!");
  message("🥚 Yeni yumurta oluştu!");

 }else{
  log("Güvercinler çiftleşti fakat henüz yumurta olmadı.");
  message("Henüz yumurta oluşmadı. Tekrar deneyebilirsin.");
 }

 update();
}

function nextDay(){

 birds.forEach(b=>{
  b.age++;
  b.health=Math.max(0,b.health-3);
 });

 eggs.forEach(e=>{
  e.days--;
 });

 let hatched=eggs.filter(e=>e.days<=0);

 hatched.forEach(e=>{
  babies.push({
   nest:e.nest,
   days:0,
   stage:"yavru"
  });

  log("🐣 "+e.nest+". yuvadaki yumurta çatladı!");
 });

 eggs=eggs.filter(e=>e.days>0);

 babies.forEach(b=>{
  b.days++;

  if(b.days>=5 && b.stage==="yavru"){
   b.stage="genç";
   log("🐤 Bir yavru genç güvercin oldu!");
  }

  if(b.days>=10 && b.stage==="genç"){

   if(birds.length<30){
    birds.push({
     id:nextId++,
     name:"Yavru #"+nextId,
     gender:Math.random()>0.5?"male":"female",
     age:10,
     health:90
    });
   }

   log("🕊️ Bir yavru yetişkin güvercin oldu!");
  }
 });

 babies=babies.filter(b=>b.days<10);

 log("☀️ Yeni gün başladı.");
 update();
}

function saveGame(){
 localStorage.setItem("kaplanKumesi",JSON.stringify({
  money,food,birds,eggs,babies,nextId
 }));
}

function loadGame(){
 let data=localStorage.getItem("kaplanKumesi");

 if(data){
  try{
   data=JSON.parse(data);
   money=data.money??1000;
   food=data.food??100;
   birds=data.birds??[];
   eggs=data.eggs??[];
   babies=data.babies??[];
   nextId=data.nextId??1;
  }catch(e){}
 }
}

loadGame();
update();
log("🏠 Kaplan Kümesi oyunu başlatıldı.");

setInterval(nextDay,60000);

</script>

</body>
</html>
